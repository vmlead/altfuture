<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <!-- facebook share tag start -->
        <meta property="og:site_name" content="Alternate Future Summit">
        <meta property=”og:type” content=”website” />
        <meta property="og:title" content="Alternate Future Summit">
        <meta property="og:description" content="The Alternate Future Summit is a one-week long Summit happening from 13th to 17th of September 2021, that will bring together the major players involved in people development. The event will include the ALT+F Hackathon, an initiative to solve global challenges and define the future of people development and social impact, by creating innovative projects.">
        <meta property="og:image" content="https://altfuture.pt/img/seoImage.png">
        <meta property="og:url" content="https://altfuture.pt/">
        <meta property="article:publisher" content="https://www.facebook.com/events/271189688106157/">
        <!-- facebook share tag end -->

        <!-- twitter share tag start -->
        <meta name="twitter:title" content="Alternate Future Summit ">
        <meta name="twitter:description" content=" The Alternate Future Summit is a one-week long Summit happening from 13th to 17th of September 2021, that will bring together the major players involved in people development. The event will include the ALT+F Hackathon, an initiative to solve global challenges and define the future of people development and social impact, by creating innovative projects.">
        <meta name="twitter:image" content="https://altfuture.pt/img/seoImage.png">
        <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200&display=swap" rel="stylesheet">
    <style>
        body {
            justify-content: center;
            text-align: center;
        }

        @font-face {
            font-family: Adobe Jenson Pro;
            src: url('/fonts/Adobe Jenson Pro Regular.otf');
        }

        h1 {
            text-align: center;
            color: #f2f5ef;
            font-family: Adobe Jenson Pro;
            letter-spacing: 3px;
        }

        .div {
            display: inline-block;
            text-align: center;
        }

        #bg {
            background-image: url(/img/certificate/certificate1.png);
            background-size: cover;
            background-repeat: no-repeat;
            margin-top:2%;
            background-position: center;
            height: 100%;
        }

        #header {
            font-size: 5.6rem;
        }

        #bg p {
            text-align: center;
            font-size: 1.5rem;
            color: #f2f5ef;
        }

        #sign_foot p {
            color: #f2f5ef;
            font-size: 1rem;
        }

        #foot {
            background-color: #fdfdfd;
            border: 2px solid #dbebcc;
        }

        #foot img {
                height: 70px;
            }

        #para {
            font-family: 'Poppins', sans-serif;
        }
        @media (max-width: 576px) {
            #header {
                font-size: 4rem;
            }
        }

        @media (max-width: 768px) {
            #header {
                font-size: 2.5rem;
            }
            #sign_foot {
                display: block;
            }
            #jermia-sign {
                margin-left: 3px;
            }
            #cal-sign {
            margin-left: 0px;
            }
            #foot img {
                height: 40px;
            }
        }

        @media (min-width: 768px) {

        }

        /* Extra small devices (phones, 600px and down) */
        /* @media only screen and (max-width: 600px) {
            #cal-sign {
                margin-left: 41%
            }
            #jermia-sign {
                margin-left: 1px;
            }
        } */

        /* Small devices (portrait tablets and large phones, 600px and up) */
        @media only screen and (min-width: 600px) {
            #cal-sign {
                margin-left: 60px;
            }
            #jermia-sign {
                margin-left: 2px;
            }
        }

        /* Medium devices (landscape tablets, 768px and up) */
        @media only screen and (min-width: 768px) {
            #cal-sign {
                margin-left: 10px;
            }
            #jermia-sign {
                margin-left: 6px;
            }
        }

        /* Large devices (laptops/desktops, 992px and up) */
        @media only screen and (min-width: 992px) {
            #cal-sign {
                margin-left: 25px;
            }
            #jermia-sign {
                margin-left: 30px;
            }
        }

        /* Extra large devices (large laptops and desktops, 1200px and up) */
        @media only screen and (min-width: 1200px) {
            #cal-sign {
                margin-left: 30px;
            }
            #jermia-sign {
                margin-left: 35px;
            }
        }

    </style>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css"
        integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">

    <title>Ambassadorship</title>
</head>

<body>
    <div class="container" style="justify-content: center;" id="bg">
        <div class="div" style="justify-content: center;">
            <h1 id="header">Certificate of Ambassadorship</h1>
            <img src="/img/certificate/line2.png" alt="underline" style="width: 70%;">
        </div>

        <div id="para">
            <p>This is to certify that ____________ has successfully completed their
            HOP Trainig & Ambassadorship Program
                from ___________ till
             ___________ by being an outstanding Ambassador and a
             significant contributor to the
                community.</p>
        </div>


        <div id="sign_foot" class="row" style="display: flex;align-items: flex-end;">
            <div class="col-xl-2 col-sm-6 col-md-2 responsive-cal">
               <p> <img id="cal-sign" src="img\certificate\Cal.png" alt="sign" style="height: 80px;"></p>
                <p>Mentor</p>
            </div>

            <div class="col-xl-3 col-sm-6 col-md-3 responsive-mentor">
                   <p> <img src="/logo/sign.png" alt="sign" style="height: 100px;"></p>
                    <p>Founder, GetBoarded</p>
            </div>

            <div class="col-xl-3 col-sm-6 col-md-4 responsive-avator">
               <p> <img class="img-fluid" style="height: 200px;" src="/img/certificate/astro1.png" alt="Hyper Orchid"></p>
            </div>

            <div class="col-xl-3 col-sm-5 col-md-3 responsive-jermia">
               <p> <img id="jermia-sign" src="img\certificate\Jermia.png" alt="sign" style="height: 70px;"> </p>
               <p>CMO, HOP</p>
            </div>

            <div class="col-xl-1 col-sm-1 col-md-1">
                <p></p>
            </div>
        </div>
    </div>
        <div id="foot" class="container" style="display: flex; justify-content: space-between;">
        <img class="img-fluid" src="/img/certificate/flogo.png" alt="getboarded">
        <img class="img-fluid" src="/img/certificate/hop123.png" alt="Hyper Orchid">

    </div>


    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-Piv4xVNRyMGpqkS2by6br4gNJ7DXjqk09RmUpJ8jgGtD7zP9yug3goQfGII0yAns"
        crossorigin="anonymous"></script>


</body>

</html>
